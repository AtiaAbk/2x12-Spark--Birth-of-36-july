# Spark: Birth of 36 July — Visual and Post-Processing Configuration
# Hot, Green, Humid Bangladeshi Summer in July

# Graphics Tier Quality: LOW, MEDIUM, HIGH (default for players with no saved setting; Settings screen overrides it)
graphicsTier=MEDIUM

# Display & Tone Mapping: 1 = ACES Filmic, 2 = Extended Reinhard, 0 = Linear Clamp
toneMappingMode=1

# Color Grading & Photographic Exposure
# T8: near-neutral grade. ACES (per channel) already adds saturation in the darks; the old
# saturation 1.18 + temperature 0.14 + green tint crushed blue out of foliage and sky
# (green-yellow cast) and pushed brick to pure red. Sky colours are now authored in linear space.
exposure=1.08
contrast=1.02
saturation=1.04
colorTemperature=0.08
colorTint=-0.01
shadowLift=0.006

# Lens Optics & Bloom
bloomStrength=0.16
bloomThreshold=0.85
vignetteStrength=0.20
vignetteRadius=0.90
filmGrainStrength=0.005

# Render Pipeline Hardware Features
hdrEnabled=true
pbrEnabled=true
iblEnabled=true
fxaaEnabled=true
