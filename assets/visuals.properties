# Spark: Birth of 36 July — Visual and Post-Processing Configuration
# Hot, Green, Humid Bangladeshi Summer in July

# Graphics Tier Quality: LOW, MEDIUM, HIGH
graphicsTier=HIGH

# Display & Tone Mapping: 1 = ACES Filmic, 2 = Extended Reinhard, 0 = Linear Clamp
toneMappingMode=1

# Color Grading & Photographic Exposure
exposure=0.98
contrast=1.06
saturation=1.12
colorTemperature=0.08
colorTint=0.0
shadowLift=0.005

# Lens Optics & Bloom
bloomStrength=0.04
bloomThreshold=0.96
vignetteStrength=0.10
vignetteRadius=0.90
filmGrainStrength=0.005

# Render Pipeline Hardware Features
hdrEnabled=true
pbrEnabled=true
iblEnabled=true
fxaaEnabled=true
